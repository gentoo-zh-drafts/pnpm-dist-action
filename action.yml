name: Create and publish a node_modules tarball
# Original author: Arthur Zamarin
# modified by: liuyujielol
description: Create a Gentoo node_modules tarball and attach it to a release
inputs:
  tag:
    description: Tag to create release on
    default: ${{ github.ref_name }}
  dist-filename:
    description: The name of distribution file (e.g. foo-1.2.3-node_modules.tar.xz)
    default: ${{ github.event.repository.name }}-${{ github.ref_name }}
  workdir:
    description: Directory holding package.json, relative to the repository root
    default: '.'
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: latest
        check-latest: true

    - uses: oven-sh/setup-bun@v2

    - name: Install node_modules
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        if [[ -f bun.lock || -f bun.lockb ]]; then
          echo "::group::Running bun install"
          bun install --frozen-lockfile
        elif [[ -f pnpm-lock.yaml ]]; then
          echo "::group::Running pnpm install"
          corepack enable pnpm
          # pnpm 11 blocks dependency build scripts by default (strictDepBuilds); the
          # vendored node_modules needs them (esbuild etc.), so allow them non-interactively.
          pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true
        else
          echo "::group::Running npm install"
          npm install --legacy-peer-deps
        fi
        echo "::endgroup::"

    - name: Create a node_modules tarball
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        XZ_OPT: "-T0 -9e"
      run: |
        echo "::group::Creating dist tarball ${{ inputs.dist-filename }}-node_modules.tar.xz"
        LC_ALL=C TZ=UTC tar \
          --mtime="${SOURCE_DATE_EPOCH:-1970-01-01}" --sort=name --owner=250 --group=250 \
          -acf "${{ github.workspace }}/${{ inputs.dist-filename }}-node_modules.tar.xz" node_modules || exit 1
        echo "::endgroup::"

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        body:
        files: |
          ${{ inputs.dist-filename }}-node_modules.tar.xz
        tag_name: ${{ inputs.tag }}
        fail_on_unmatched_files: true
